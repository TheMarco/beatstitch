name: Desktop package validation

on:
  workflow_dispatch:
    inputs:
      optional_packs:
        description: Include and exercise build/drop and vocal-separation models
        type: boolean
        default: true
  push:
    branches: [codex/package-validation]

permissions:
  contents: read

# Bash is installed on both hosted runners and stops multiline native-command
# steps at the first failure. PowerShell otherwise checks only the last command.
defaults:
  run:
    shell: bash

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-package:
    name: Desktop package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DJ_OPTIONAL_PACKS: ${{ github.event_name == 'push' || inputs.optional_packs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Install Linux audio and Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned Windows audio tools
        if: runner.os == 'Windows'
        run: python ci/install_windows_audio.py --destination build/audio-tools --github-path
      - name: Install CPU analysis and desktop dependencies
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-desktop.txt -r requirements-key.txt pyinstaller==6.22.3
      - name: Install optional worker dependencies
        if: env.DJ_OPTIONAL_PACKS == 'true'
        run: python -m pip install -r requirements-sections.txt -r requirements-separation.txt
      - name: Prepare verified core models and original practice audio
        run: |
          python download_structure_model.py
          python download_content_model.py
          python download_key_model.py
          python build_demo_assets.py
          python build_listening_lessons.py
      - name: Prepare verified optional models
        if: env.DJ_OPTIONAL_PACKS == 'true'
        run: |
          python download_section_models.py
          python download_separation_model.py --destination assets/separation
      - name: Check packaging, key-runtime compatibility, mix guide and offline help
        run: python -m unittest tests.test_windows_audio_tools tests.test_package_check tests.test_key_detection tests.test_first_mix tests.test_help tests.test_optional_package_check tests.test_section_model_download tests.test_spleeter tests.test_release_source_bundle tests.test_about -v
      - name: Check timing freshness, preview controls and listening guidance
        run: python -m unittest tests.test_timing_freshness tests.test_timing_comparison tests.test_preview_navigation tests.test_transition_audio tests.test_listening tests.test_recommendations tests.test_content tests.test_demo.DemoAssetsTests -v
      - name: Build and exercise the core package
        if: env.DJ_OPTIONAL_PACKS != 'true'
        run: python build_desktop.py --check
      - name: Build and exercise the package with optional models
        if: env.DJ_OPTIONAL_PACKS == 'true'
        run: python build_desktop.py --with-sections --with-separation --check
      - name: Exercise both packaged optional workers on Windows
        if: env.DJ_OPTIONAL_PACKS == 'true' && runner.os == 'Windows'
        run: python -m ci.check_optional_workers --executable "dist/BeatStitch/BeatStitch.exe" --resources "dist/BeatStitch/_internal" --output dist/optional-package-check --sections --separation
      - name: Exercise both packaged optional workers on Linux
        if: env.DJ_OPTIONAL_PACKS == 'true' && runner.os == 'Linux'
        run: python -m ci.check_optional_workers --executable "dist/BeatStitch/BeatStitch" --resources "dist/BeatStitch/_internal" --output dist/optional-package-check --sections --separation
      - name: Keep the tested Windows app
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeatStitch-windows-x64
          path: dist/BeatStitch/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Archive the tested Linux app with executable permissions
        if: success() && runner.os == 'Linux'
        run: tar -czf dist/BeatStitch-linux-x64.tar.gz -C dist BeatStitch
      - name: Keep the tested Linux app
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeatStitch-linux-x64
          path: dist/BeatStitch-linux-x64.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Keep build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-reports-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            dist/package-check-*/report.json
            dist/optional-package-check/report.json
            dist/optional-package-check/*.log
            build/audio-tools/manifest.json
            build/BeatStitch/warn-BeatStitch.txt
            build/BeatStitch.spec
