name: Desktop package validation

on:
  workflow_dispatch:
    inputs:
      collect_release_sources:
        description: Collect native sources for the already tested 0.1.1 Linux archive (no rebuild)
        type: boolean
        default: false
      optional_packs:
        description: Also exercise large external build/drop and vocal-removal models (development check)
        type: boolean
        default: false
  push:
    branches: [codex/package-validation]

permissions:
  contents: read

# Bash is installed on both hosted runners and stops multiline native-command
# steps at the first failure. PowerShell otherwise checks only the last command.
defaults:
  run:
    shell: bash

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.collect_release_sources
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the same Ubuntu native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Retrieve the tested Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38518953939 --repo TheMarco/beatstitch --name BeatStitch-0.1.1-linux-x64 --dir build/source-input
      - name: Match native identities and collect exact Ubuntu sources
        run: python3 ci/collect_linux_release_sources.py --archive build/source-input/BeatStitch-0.1.1-linux-x64.tar.gz --sha256 27e749998b625ab3cd0d379c7ea9ca3da7dd4d1a817f8f936df0fb84c1b6d75c --output build/linux-release-sources
      - name: Preserve sources and explicit coverage gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeatStitch-0.1.1-linux-native-sources
          path: build/linux-release-sources/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  desktop-package:
    if: github.event_name != 'workflow_dispatch' || !inputs.collect_release_sources
    name: Desktop package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: tests
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DJ_OPTIONAL_PACKS: ${{ github.event_name == 'workflow_dispatch' && inputs.optional_packs }}
    steps:
      - name: Reserve Linux disk space for offline model packs
        if: runner.os == 'Linux'
        run: |
          # This is a disposable hosted runner. These preinstalled SDKs are not
          # used by the Python/Qt build; keep room for models and the frozen app.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Install Linux audio and Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned Windows audio tools
        if: runner.os == 'Windows'
        run: python ci/install_windows_audio.py --destination build/audio-tools --github-path
      - name: Install CPU analysis and desktop dependencies
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-desktop.txt -r requirements-key.txt pyinstaller==6.22.3
      - name: Install optional worker dependencies
        run: python -m pip install -r requirements-sections.txt -r requirements-separation.txt
      - name: Read application release version
        run: python -c "import os; from studio_version import VERSION; open(os.environ['GITHUB_ENV'],'a').write('BEATSTITCH_VERSION='+VERSION+'\n')"
      - name: Prepare original practice audio (no bundled model weights)
        run: |
          python build_demo_assets.py
          python build_listening_lessons.py
      - name: Prepare small content model for existing inference and cancellation tests
        # Test input only: default packaging excludes this checkpoint and the
        # frozen package's absence gate rejects accidentally bundled weights.
        run: python download_content_model.py --destination assets/models/panns-cnn10.pth
      - name: Prepare verified optional models
        if: env.DJ_OPTIONAL_PACKS == 'true'
        run: |
          python download_section_models.py --destination build/test-models/sections
          python download_separation_model.py --destination build/test-models/separation
      - name: Check packaging, key-runtime compatibility, mix guide and offline help
        run: python -m unittest tests.test_windows_audio_tools tests.test_package_check tests.test_lightweight_packaging tests.test_model_downloads tests.test_model_download_ui tests.test_key_detection tests.test_first_mix tests.test_help tests.test_optional_package_check tests.test_section_model_download tests.test_spleeter tests.test_release_source_bundle tests.test_about -v
      - name: Check timing freshness, preview controls and listening guidance
        run: python -m unittest tests.test_desktop_controls tests.test_beat_alignment tests.test_alignment_audio tests.test_alignment_controls tests.test_library tests.test_processing tests.test_relink tests.test_timing_freshness tests.test_timing_comparison tests.test_preview_navigation tests.test_transition_audio tests.test_listening tests.test_recommendations tests.test_content tests.test_demo.DemoAssetsTests -v
      - name: Build and exercise the model-free package
        run: python build_desktop.py --check
      - name: Exercise an actual in-app download on Windows
        if: runner.os == 'Windows'
        run: dist/BeatStitch/BeatStitch.exe --check-model-download dist/model-download-check
      - name: Exercise an actual in-app download on Linux
        if: runner.os == 'Linux'
        run: dist/BeatStitch/BeatStitch --check-model-download dist/model-download-check
      - name: Exercise both packaged optional workers on Windows
        if: env.DJ_OPTIONAL_PACKS == 'true' && runner.os == 'Windows'
        run: python -m ci.check_optional_workers --executable "dist/BeatStitch/BeatStitch.exe" --resources "dist/BeatStitch/_internal" --output dist/optional-package-check --model-dir build/test-models --sections --separation
      - name: Exercise both packaged optional workers on Linux
        if: env.DJ_OPTIONAL_PACKS == 'true' && runner.os == 'Linux'
        run: python -m ci.check_optional_workers --executable "dist/BeatStitch/BeatStitch" --resources "dist/BeatStitch/_internal" --output dist/optional-package-check --model-dir build/test-models --sections --separation
      - name: Keep the tested Windows app
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeatStitch-${{ env.BEATSTITCH_VERSION }}-windows-x64
          path: dist/BeatStitch/
          compression-level: 6
          retention-days: 3
          if-no-files-found: error
      - name: Archive the tested Linux app with executable permissions
        if: success() && runner.os == 'Linux'
        run: tar -czf dist/BeatStitch-${BEATSTITCH_VERSION}-linux-x64.tar.gz -C dist BeatStitch
      - name: Keep the tested Linux app
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeatStitch-${{ env.BEATSTITCH_VERSION }}-linux-x64
          path: dist/BeatStitch-${{ env.BEATSTITCH_VERSION }}-linux-x64.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Keep build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-reports-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            dist/package-check-*/report.json
            dist/optional-package-check/report.json
            dist/optional-package-check/*.log
            dist/model-download-check/report.json
            build/audio-tools/manifest.json
            build/BeatStitch/warn-BeatStitch.txt
            build/BeatStitch.spec
